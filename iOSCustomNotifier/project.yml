name: iOSCustomNotifier
options:
  bundleIdPrefix: com.customnotif
  deploymentTarget:
    iOS: "16.0"

targets:
  iOSCustomNotifier:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iOSCustomNotifier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.customnotif.app
        INFOPLIST_FILE: iOSCustomNotifier/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
