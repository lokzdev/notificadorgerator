name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iOSCustomNotifier
          xcodegen generate

      - name: Build Application with Xcode
        run: |
          cd iOSCustomNotifier
          mkdir -p build
          xcodebuild clean build \
            -project iOSCustomNotifier.xcodeproj \
            -scheme iOSCustomNotifier \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > build.log 2>&1 || (cat build.log && exit 1)

      - name: Package into IPA
        run: |
          cd iOSCustomNotifier
          mkdir -p Payload
          cp -r build/iOSCustomNotifier.app Payload/
          zip -r NotificadorCustom.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificadorCustom-ipa
          path: iOSCustomNotifier/NotificadorCustom.ipa

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: iOSCustomNotifier/build.log
