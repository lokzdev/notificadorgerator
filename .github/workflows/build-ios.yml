name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iOSCustomNotifier
          xcodegen generate

      - name: Build Application with Xcode Archive
        run: |
          cd iOSCustomNotifier
          xcodebuild archive \
            -project iOSCustomNotifier.xcodeproj \
            -scheme iOSCustomNotifier \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee archive.log || (echo "=== ARCHIVE LOG TAIL ===" && tail -n 80 archive.log && exit 1)

      - name: Package into IPA
        run: |
          cd iOSCustomNotifier
          mkdir -p Payload
          cp -r ./build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r NotificadorCustom.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificadorCustom-ipa
          path: iOSCustomNotifier/NotificadorCustom.ipa
