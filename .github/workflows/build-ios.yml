name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA for iPhone
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          git config --global --add safe.directory "*"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iOSCustomNotifier
          xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          cd iOSCustomNotifier
          set +e
          xcodebuild archive \
            -project iOSCustomNotifier.xcodeproj \
            -scheme iOSCustomNotifier \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > build.log 2>&1
          EXIT_CODE=$?
          
          # Salva o log no branch build-logs para inspeção imediata
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git checkout -B build-logs
          echo "EXIT CODE: $EXIT_CODE" > build-error.log
          cat build.log >> build-error.log
          git add -f build-error.log
          git commit -m "Upload build log" || true
          git push -f origin build-logs || true
          
          exit $EXIT_CODE

      - name: Generate Unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/App.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r "NotificadorCustom.ipa" Payload
          mv NotificadorCustom.ipa "$GITHUB_WORKSPACE/NotificadorCustom.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificadorCustom-ipa
          path: NotificadorCustom.ipa
