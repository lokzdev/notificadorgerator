name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iOSCustomNotifier
          xcodegen generate

      - name: Build Application with Xcode
        run: |
          cd iOSCustomNotifier
          xcodebuild clean build \
            -project iOSCustomNotifier.xcodeproj \
            -scheme iOSCustomNotifier \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          cd iOSCustomNotifier
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r NotificadorCustom.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificadorCustom-ipa
          path: iOSCustomNotifier/NotificadorCustom.ipa
